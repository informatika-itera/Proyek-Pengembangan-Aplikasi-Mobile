name: KMP Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  android:
    name: Android build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Gradle wrapper execute permission
        run: chmod +x ./gradlew

      - name: Compile Android source set
        run: ./gradlew :composeApp:compileAndroidMain -PbuildProfile=ci -PbuildTarget=Android

      - name: Assemble Android source set
        run: ./gradlew :composeApp:assembleAndroidMain -PbuildProfile=ci -PbuildTarget=Android

  common:
    name: Shared Kotlin checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Gradle wrapper execute permission
        run: chmod +x ./gradlew

      - name: Compile shared Kotlin metadata
        run: ./gradlew :composeApp:compileKotlinMetadata -PbuildProfile=ci -PbuildTarget=metadata

      - name: Compile unit test sources
        run: ./gradlew :composeApp:assembleUnitTest -PbuildProfile=ci -PbuildTarget=tests

  ios:
    name: iOS simulator build (optional)
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Gradle wrapper execute permission
        run: chmod +x ./gradlew

      - name: Compile iOS simulator target (optional)
        shell: bash
        run: |
          set +e
          ./gradlew :composeApp:compileKotlinIosSimulatorArm64 -PbuildProfile=ci -PbuildTarget=iOS-simulator
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "::warning::Optional iOS simulator compile failed. Fix iOS separately; Android/common CI remains authoritative for now."
          fi
          exit 0

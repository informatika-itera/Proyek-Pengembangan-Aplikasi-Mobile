name: FoodSaver CI

on:
  push:
    branches:
      - main
      - master
      - project/123140089-123140125-FoodSaver
      - Project/123140089-123140125-FoodSaver

  pull_request:
    branches:
      - main
      - master
      - project/123140089-123140125-FoodSaver
      - Project/123140089-123140125-FoodSaver

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Fix corrupted Gradle Wrapper
        run: |
          mkdir -p gradle/wrapper
          wget -O gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v8.7.0/gradle/wrapper/gradle-wrapper.jar

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Create local.properties
        run: echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" > local.properties

      - name: Build and Test
        run: ./gradlew build
name: MoveIn CI

on:
  push:
    branches:
      - main
      - develop
      - "Project/123140169-123140186-MoveIn"
  pull_request:
    branches:
      - main
      - develop
      - "Project/123140169-123140186-MoveIn"
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build and Test Android Debug
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Grant Execute Permission for Gradle Wrapper
        run: chmod +x ./gradlew

      - name: Create Mock local.properties
        run: echo "GEMINI_API_KEY=mock_key_for_ci_build" > local.properties

      - name: Build Debug APK
        run: ./gradlew :composeApp:assembleDebug --stacktrace

      - name: Run Unit Test
        run: ./gradlew :composeApp:testDebugUnitTest --stacktrace
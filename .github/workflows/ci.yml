name: CI

on:
  push:
    branches:
      - "project/**"
  pull_request:
    branches:
      - "project/**"

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Gradle build and unit tests
        run: |
          chmod +x ./gradlew
          ./gradlew :composeApp:assembleDebug :composeApp:testDebugUnitTest --stacktrace

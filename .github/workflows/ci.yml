name: Build and Release InventRa

on:
  push:
    branches: [ 'project/123140062_123140132_InventRa' ]
    tags:
      - 'v*'
  pull_request:
    branches: [ 'project/123140062_123140132_InventRa' ]

jobs:
  # --- JOB 1: BUILD ANDROID ---
  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'
      
      - name: Setup local.properties
        run: |
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> local.properties
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" >> local.properties
          echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" >> local.properties
          echo "SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" >> local.properties

      - name: Build Android Release APK
        run: ./gradlew :composeApp:assembleRelease --no-daemon

      - name: Prepare APK for Upload
        run: |
          mkdir -p release-artifacts
          cp composeApp/build/outputs/apk/release/InventRa-release.apk release-artifacts/InventRa-Android.apk

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: InventRa-Android
          path: release-artifacts/

  # --- JOB 2: BUILD IOS ---
  build-ios:
    name: Build iOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'
      
      - name: Setup local.properties
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" >> local.properties
          echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" >> local.properties

      - name: Build iOS Framework
        run: ./gradlew :composeApp:linkReleaseFrameworkIosArm64 --no-daemon

      - name: Zip iOS Framework
        run: |
          cd composeApp/build/bin/iosArm64/releaseFramework/
          zip -r ../../../../InventRa-iOS-Framework.zip .
          
      - name: Upload iOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: InventRa-iOS
          path: InventRa-iOS-Framework.zip

  # --- JOB 3: UNIFIED RELEASE (Android & iOS) ---
  publish-release:
    name: Publish Release
    needs: [build-android, build-ios]
    if: github.event_name == 'push' # Berjalan di push branch maupun tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: Determine Release Type
        id: info
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
            echo "title=InventRa Release ${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "prerelease=false" >> $GITHUB_OUTPUT
          else
            echo "tag=latest" >> $GITHUB_OUTPUT
            echo "title=InventRa Latest (Auto-Build)" >> $GITHUB_OUTPUT
            echo "prerelease=true" >> $GITHUB_OUTPUT
          fi

      - name: Create/Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.info.outputs.tag }}
          name: ${{ steps.info.outputs.title }}
          files: |
            assets/InventRa-Android.apk
            assets/InventRa-iOS-Framework.zip
          body: |
            ## 🚀 InventRa Automatic Release
            Berikut adalah hasil build terbaru dari sistem CI/CD.
            
            - **Trigger:** `${{ github.ref_name }}`
            - **Commit:** `${{ github.sha }}`
            
            *Catatan: File iOS saat ini berupa Framework .zip untuk diimport ke Xcode.*
          prerelease: ${{ steps.info.outputs.prerelease }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

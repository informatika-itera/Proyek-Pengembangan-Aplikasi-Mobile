name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Version name, for example 1.0.0-rc4
        required: true
        type: string
      prerelease:
        description: Mark GitHub release as pre-release
        required: true
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  validate-release:
    name: Validate release input
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}

    steps:
      - name: Resolve release version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            tag="${GITHUB_REF_NAME}"

            if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9._-]+)?$ ]]; then
              echo "Release tag must look like v1.0.0 or v1.0.0-rc4"
              exit 1
            fi

            version="${tag#v}"
            prerelease="false"
            if [[ "$version" == *-* ]]; then
              prerelease="true"
            fi
          else
            version="${{ inputs.version }}"
            prerelease="${{ inputs.prerelease }}"

            if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9._-]+)?$ ]]; then
              echo "Version must look like 1.0.0 or 1.0.0-rc4"
              exit 1
            fi
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

  android-release:
    name: Build signed Android release APKs
    runs-on: ubuntu-latest
    needs: validate-release

    env:
      RELEASE_VERSION: ${{ needs.validate-release.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Gradle wrapper execute permission
        run: chmod +x ./gradlew

      - name: Compile shared Kotlin metadata
        run: ./gradlew :composeApp:compileKotlinMetadata -PbuildProfile=release -PbuildTarget=metadata -Papp.versionName=${RELEASE_VERSION}

      - name: Compile unit test sources
        run: ./gradlew :composeApp:assembleUnitTest -PbuildProfile=release -PbuildTarget=tests -Papp.versionName=${RELEASE_VERSION}

      - name: Decode Android signing keystore
        shell: bash
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          ANDROID_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          for name in \
            ANDROID_RELEASE_KEYSTORE_BASE64 \
            ANDROID_RELEASE_KEYSTORE_PASSWORD \
            ANDROID_RELEASE_KEY_ALIAS \
            ANDROID_RELEASE_KEY_PASSWORD
          do
            if [ -z "${!name}" ]; then
              echo "Missing required repository secret: ${name}"
              exit 1
            fi
          done

          mkdir -p "$RUNNER_TEMP/android-signing"
          printf '%s' "$ANDROID_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/android-signing/release.keystore"

      - name: Build signed Android release APKs
        shell: bash
        env:
          ANDROID_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          ./gradlew :androidApp:assembleRelease \
            -PbuildProfile=release \
            -PbuildTarget=Android \
            -Papp.versionName=${RELEASE_VERSION} \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/android-signing/release.keystore" \
            -Pandroid.injected.signing.store.password="$ANDROID_RELEASE_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$ANDROID_RELEASE_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$ANDROID_RELEASE_KEY_PASSWORD"

      - name: Verify Android APK signatures
        shell: bash
        run: |
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"

          if [ -z "$apksigner" ]; then
            echo "apksigner was not found in Android SDK build-tools"
            exit 1
          fi

          find androidApp/build/outputs/apk/release -type f -name "*.apk" -print0 |
          while IFS= read -r -d '' apk; do
            echo "Verifying signature: $apk"
            "$apksigner" verify --verbose "$apk"
          done

      - name: Rename Android APKs and generate checksums
        shell: bash
        run: |
          version="v${RELEASE_VERSION#v}"
          output_dir="release-artifacts/android"
          mkdir -p "$output_dir"

          find androidApp/build/outputs/apk/release -type f -name "*.apk" -print0 |
          while IFS= read -r -d '' apk; do
            apk_name="$(basename "$apk")"
            arch="universal"
            case "$apk_name" in
              *arm64-v8a*) arch="arm-v8a" ;;
              *armeabi-v7a*) arch="arm-v7a" ;;
              *x86_64*) arch="x86-64" ;;
              *universal*) arch="universal" ;;
            esac
            cp "$apk" "$output_dir/MyBawangGacha-${version}-${arch}.apk"
          done

          for arch in arm-v8a arm-v7a x86-64 universal; do
            if [ ! -f "$output_dir/MyBawangGacha-${version}-${arch}.apk" ]; then
              echo "::warning::Missing APK for ${arch}"
            fi
          done

          if ! find "$output_dir" -type f -name "*.apk" | grep -q .; then
            echo "No Android APK was produced"
            exit 1
          fi

          (
            cd "$output_dir"
            shasum -a 256 *.apk | sort > SHA256SUMS
          )

      - name: Upload signed Android APKs and checksums
        uses: actions/upload-artifact@v4
        with:
          name: mybawanggacha-${{ env.RELEASE_VERSION }}-signed-android-apks
          path: |
            release-artifacts/android/*.apk
            release-artifacts/android/SHA256SUMS
          if-no-files-found: error

  ios-simulator:
    name: Build iOS simulator artifact (optional)
    runs-on: macos-latest
    needs: validate-release

    env:
      RELEASE_VERSION: ${{ needs.validate-release.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Gradle wrapper execute permission
        run: chmod +x ./gradlew

      - name: Build iOS simulator artifact (optional)
        shell: bash
        run: |
          set +e
          ./gradlew :composeApp:compileKotlinIosSimulatorArm64 \
            -PbuildProfile=release \
            -PbuildTarget=iOS-simulator \
            -Papp.versionName=${RELEASE_VERSION}
          status=$?

          if [ "$status" -ne 0 ]; then
            echo "::warning::Optional iOS simulator artifact build failed. Android release artifacts will still be published."
          fi

          exit 0

      - name: Collect iOS simulator artifacts (optional)
        shell: bash
        run: |
          mkdir -p release-artifacts/ios
          find composeApp/build -type f \( -name "*.klib" -o -name "*.framework.zip" \) -print -exec cp {} release-artifacts/ios/ \; || true

          if find release-artifacts/ios -type f | grep -q .; then
            (
              cd release-artifacts/ios
              shasum -a 256 * | sort > SHA256SUMS
            )
          else
            echo "::warning::No iOS simulator artifact was collected."
          fi

      - name: Upload iOS simulator artifact (optional)
        uses: actions/upload-artifact@v4
        with:
          name: mybawanggacha-${{ env.RELEASE_VERSION }}-ios-simulator-artifact
          path: release-artifacts/ios/
          if-no-files-found: warn

  publish-release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs:
      - validate-release
      - android-release
      - ios-simulator
    if: ${{ always() && needs.validate-release.result == 'success' && needs.android-release.result == 'success' }}

    env:
      RELEASE_VERSION: ${{ needs.validate-release.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download signed Android APKs and checksums
        uses: actions/download-artifact@v4
        with:
          name: mybawanggacha-${{ env.RELEASE_VERSION }}-signed-android-apks
          path: release-files/android

      - name: Download iOS simulator artifact (optional)
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: mybawanggacha-${{ env.RELEASE_VERSION }}-ios-simulator-artifact
          path: release-files/ios

      - name: Verify release files
        shell: bash
        run: |
          find release-files -type f -print | sort

          if ! find release-files/android -type f -name "*.apk" | grep -q .; then
            echo "No signed Android APKs were downloaded"
            exit 1
          fi

          if [ ! -f release-files/android/SHA256SUMS ]; then
            echo "Missing Android SHA256SUMS"
            exit 1
          fi

      - name: Verify or create release tag
        shell: bash
        run: |
          release_tag="v${RELEASE_VERSION}"

          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            if [ "${GITHUB_REF_TYPE}" != "tag" ] || [ "${GITHUB_REF_NAME}" != "$release_tag" ]; then
              echo "Tag mismatch: expected ${release_tag}, got ${GITHUB_REF_NAME}."
              exit 1
            fi

            echo "Using pushed tag ${release_tag}."
            exit 0
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/${release_tag}" >/dev/null 2>&1; then
            echo "Tag ${release_tag} already exists on origin."
          else
            git tag "${release_tag}"
            git push origin "refs/tags/${release_tag}"
          fi

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.RELEASE_VERSION }}
          name: MyBawangGacha ${{ env.RELEASE_VERSION }}
          prerelease: ${{ needs.validate-release.outputs.prerelease }}
          files: |
            release-files/android/*.apk
            release-files/android/SHA256SUMS
            release-files/ios/*
          fail_on_unmatched_files: false
          body: |
            Automated release for MyBawangGacha ${{ env.RELEASE_VERSION }}.

            Build metadata is embedded through Gradle:
            - Profile: release
            - Commit: ${{ github.sha }}
            - Run ID: ${{ github.run_id }}

            Android release APKs are signed with the repository release key.
            APK checksums are attached as SHA256SUMS.
